name: Integracion Continua

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitzone_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fitzone_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar Backend
        run: |
          cd backend
          npm ci

      - name: Preparar bases de datos aisladas
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres fitzone_integration_test
          for database in fitzone_app_test fitzone_integration_test; do
            psql "postgres://postgres:postgres@localhost:5432/$database?sslmode=disable" \
              -v ON_ERROR_STOP=1 -f backend/tests/activities-test-schema.sql
            (cd backend && DATABASE_URL="postgres://postgres:postgres@localhost:5432/$database?sslmode=disable" node apply_migrations.mjs)
          done

      - name: Ejecutar pruebas Backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fitzone_app_test?sslmode=disable
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fitzone_integration_test?sslmode=disable
        run: |
          cd backend
          npm run test:coverage

      - name: Verificar y Compilar Frontend
        run: |
          cd frontend
          npm ci
          npm test
          npm run build